name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          wheel=(dist/*.whl)
          python -m pip install "${wheel[0]}[dev]"
      - name: Check code
        run: |
          ruff check .
          ruff format --check .
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check installed entry points
        run: |
          terrainweave --help
          python -m terrainweave generate --help
          PYTHONPATH=src python -S -m terrainweave human serve --help
      - name: Check the evaluation corpus
        run: terrainweave data audit

  optional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the package and optional dependencies
        run: python -m pip install '.[dev,demo,ml,human]'
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run all regression tests and measure coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage combine
          python -m coverage report -m --format=markdown >> "$GITHUB_STEP_SUMMARY"
