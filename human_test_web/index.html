<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TerrainWeave Human Test</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#101714;color:#edf2e9;font:16px system-ui,sans-serif;text-align:center}main{max-width:860px;margin:24px auto;padding:0 18px 40px}.eyebrow{color:#9dcf68;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(28px,5vw,48px);margin:14px 0 8px}.intro{color:#c6d5cb;line-height:1.55;max-width:680px;margin:0 auto 22px}.panel{background:#172b25;border:1px solid #365345;border-radius:18px;padding:24px;margin:18px auto;text-align:left}button,select{font:inherit;padding:12px 18px;margin:5px;border:0;border-radius:999px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#begin{background:#9dcf68;color:#102016;font-weight:700}#yes{background:#e8b253;color:#1e170b}#no{background:#a9bbb2;color:#102016}#scene{width:min(92vw,820px);max-height:58vh;object-fit:contain;background:#080c0a;display:none;margin:20px auto;border-radius:10px}#answers[hidden],#test[hidden],#done[hidden]{display:none}.muted{color:#aabcb2}.rules li{margin:10px 0}.progress{color:#9dcf68;margin:14px}
</style></head><body><main><div class="eyebrow">TerrainWeave / Human Test</div><h1 id="title"></h1><p class="intro" id="subtitle"></p>
<div class="panel" id="consent"><label>Language / Lingua: <select id="language"><option value="en">English</option><option value="it">Italiano</option></select></label><h2 id="rules-title"></h2><ul class="rules" id="rules"></ul><label><input type="checkbox" id="agree"> <span id="agree-label"></span></label><br><button id="begin" disabled></button></div>
<div id="test" hidden><label id="exposure-label"></label><select id="exposure"><option value="100">100 ms</option><option value="250">250 ms</option><option value="500" selected>500 ms</option></select><button id="start"></button><div class="progress" id="progress"></div><img id="scene" alt="Test scene"><p id="status" class="muted"></p><div id="answers" hidden><button id="yes"></button><button id="no"></button></div></div>
<div class="panel" id="done" hidden><h2 id="done-title"></h2><p id="done-text" class="muted"></p></div></main>
<script>
const copy={en:{title:'Can you spot the figure?',subtitle:'This is an anonymous visual-recognition study. Each scene is shown briefly, then you answer from memory.',rulesTitle:'Before you begin',rules:['Look at each scene only during the timed exposure.','After the image disappears, answer whether you noticed a person or uniform.','There are no right or wrong answers. Please do not repeat the test.','No name, email address, or IP address is intentionally collected.'],agree:'I have read the rules and agree to participate.',begin:'Begin test',exposure:'Exposure time',start:'Start trial',ready:'Ready.',observe:'Observe...',question:'Was a person or uniform visible?',yes:'Yes, I detected it',no:'No, I did not detect it',recorded:'Answer recorded.',complete:'Test complete.',thank:'Thank you for participating. Your anonymous responses were saved.',upload:'Sending response...'},it:{title:'Riesci a vedere la figura?',subtitle:'Questo è uno studio anonimo di riconoscimento visivo. Ogni scena viene mostrata brevemente, poi rispondi a memoria.',rulesTitle:'Prima di iniziare',rules:['Osserva ogni scena solo durante il tempo stabilito.','Quando l’immagine scompare, indica se hai notato una persona o una divisa.','Non ci sono risposte giuste o sbagliate. Non ripetere il test.','Non vengono intenzionalmente raccolti nome, email o indirizzo IP.'],agree:'Ho letto le regole e accetto di partecipare.',begin:'Inizia il test',exposure:'Tempo di esposizione',start:'Inizia prova',ready:'Pronto.',observe:'Osserva...',question:'Era visibile una persona o una divisa?',yes:'Sì, l’ho vista',no:'No, non l’ho vista',recorded:'Risposta registrata.',complete:'Test completato.',thank:'Grazie per aver partecipato. Le tue risposte anonime sono state salvate.',upload:'Invio della risposta...'}};
let lang='en',words=copy.en,trials=[],order=[],index=0,session=crypto.randomUUID(),shownAt=0,timer=null,waiting=false;const $=id=>document.getElementById(id);
function render(){words=copy[lang];$('title').textContent=words.title;$('subtitle').textContent=words.subtitle;$('rules-title').textContent=words.rulesTitle;$('rules').innerHTML=words.rules.map(x=>`<li>${x}</li>`).join('');$('agree-label').textContent=words.agree;$('begin').textContent=words.begin;$('exposure-label').textContent=words.exposure;$('start').textContent=words.start;$('status').textContent=words.ready;$('yes').textContent=words.yes;$('no').textContent=words.no;$('done-title').textContent=words.complete;$('done-text').textContent=words.thank}
$('language').onchange=e=>{lang=e.target.value;render()};$('agree').onchange=e=>$('begin').disabled=!e.target.checked;render();
$('begin').onclick=async()=>{const response=await fetch('/api/trials');const data=await response.json();trials=data.trials;order=[...trials].sort(()=>Math.random()-.5);if(!order.length){alert('No test scenes available');return}$('consent').hidden=true;$('test').hidden=false;progress()};function progress(){$('progress').textContent=`${Math.min(index+1,order.length)} / ${order.length}`}
$('start').onclick=()=>{if(index>=order.length)return;clearTimeout(timer);waiting=true;$('answers').hidden=true;const item=order[index];let exposureStarted=false;const beginExposure=()=>{if(!waiting||exposureStarted)return;exposureStarted=true;$('scene').style.visibility='visible';$('status').textContent=words.observe;progress();shownAt=performance.now();timer=setTimeout(()=>{$('scene').style.visibility='hidden';$('answers').hidden=false;$('status').textContent=words.question},Number($('exposure').value))};$('scene').style.display='block';$('scene').style.visibility='hidden';$('scene').onload=beginExposure;$('scene').src=item.image;if($('scene').complete)beginExposure()};
async function answer(value){if(!waiting)return;waiting=false;const item=order[index];const payload={session_id:session,language:lang,trial_id:item.trial_id,exposure_ms:Number($('exposure').value),detected:value,latency_ms:Math.round(performance.now()-shownAt),confidence:''};$('status').textContent=words.upload;try{await fetch('/api/responses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})}catch(e){$('status').textContent='Connection error. Please retry.';waiting=true;return}$('scene').style.display='none';$('answers').hidden=true;index++;progress();if(index<order.length)$('status').textContent=words.recorded;else{$('test').hidden=true;$('done').hidden=false}}
$('yes').onclick=()=>answer('yes');$('no').onclick=()=>answer('no');
</script></body></html>
