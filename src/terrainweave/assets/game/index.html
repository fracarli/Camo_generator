<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f2a1c">
  <title>TerrainWeave · Trova l'omino</title>
  <meta name="description" content="Un gioco da un minuto: trova l'omino mimetizzato nel paesaggio e aiutaci a capire quali mimetismi funzionano davvero.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Riesci a trovare l'omino mimetizzato?">
  <meta property="og:description" content="Tre mini giochi da un minuto. Le tue risposte anonime aiutano a migliorare i mimetismi di TerrainWeave.">
  <meta property="og:image" content="__SITE_URL__og.jpg">
  <meta property="og:url" content="__SITE_URL__">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --paper: #f3f1e8;
      --panel: #fbfaf4;
      --ink: #1d251a;
      --muted: #56604f;
      --line: #cdd2c2;
      --pine: #263623;
      --moss: #557345;
      --sand: #c8a96a;
      --hit: #2f9e44;
      --miss: #d9480f;
      --night: #182016;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body { min-height: 100svh; -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #6b8f3c; outline-offset: 3px; }
    h1, h2, h3, p { margin: 0; }
    p, li { line-height: 1.55; }
    a { color: #34572c; }
    .wrap { width: min(1080px, 100% - 32px); margin-inline: auto; }

    /* Header */
    .top { border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
    .top .wrap { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 780; letter-spacing: -.05em; font-size: 19px; background: none; border: 0; padding: 0; }
    .brand i { width: 22px; height: 22px; border-radius: 5px; background: linear-gradient(135deg, #45593d 0 35%, #9bac70 35% 51%, #d5e2ad 51% 67%, #45593d 67%); }
    .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .lang button { border: 0; background: transparent; padding: 6px 11px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .lang button[aria-pressed="true"] { background: var(--pine); color: #fff; }

    /* Home */
    .hero { padding-block: clamp(28px, 7vw, 72px) clamp(20px, 4vw, 36px); display: grid; gap: 18px; }
    .eyebrow { font-size: 13px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; color: var(--moss); }
    .hero h1 { font-size: clamp(38px, 7.5vw, 84px); line-height: .96; letter-spacing: -.065em; font-weight: 800; text-wrap: balance; max-width: 15ch; }
    .hero p { color: var(--muted); font-size: clamp(16px, 2vw, 20px); max-width: 52ch; }
    .actions .btn.quick { flex: none; padding-inline: 34px; }
    .test-badge { margin-left: 8px; font-size: 11px; font-weight: 800; color: #fff; background: #c2410c; border-radius: 6px; padding: 2px 6px; letter-spacing: .04em; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 650; background: var(--panel); }
    .games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-bottom: 28px; }
    .game-card { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 18px; padding: 0; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s ease, box-shadow .15s ease; }
    .game-card:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -18px rgba(30, 45, 25, .55); }
    .game-art { aspect-ratio: 16 / 9; position: relative; overflow: hidden; background: var(--night); }
    .game-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .game-art .badge { position: absolute; left: 12px; top: 12px; background: rgba(20, 28, 18, .78); color: #fff; font-weight: 800; border-radius: 8px; padding: 3px 9px; font-size: 13px; letter-spacing: .02em; }
    .game-art .flashbar { position: absolute; inset: auto 0 0 0; height: 5px; background: linear-gradient(90deg, #ffd43b 0 40%, transparent 40%); }
    .game-body { padding: 16px 18px 18px; display: grid; gap: 7px; flex: 1; align-content: start; }
    .game-body h2 { font-size: 23px; letter-spacing: -.035em; }
    .game-body .hook { font-weight: 700; color: var(--pine); }
    .game-body p { color: var(--muted); font-size: 15px; }
    .game-meta { margin-top: auto; padding-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); font-weight: 650; }
    .play-pill { background: var(--pine); color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 750; }
    .best { color: var(--moss); }
    .beta { border-top: 1px solid var(--line); padding-block: 26px 30px; display: grid; gap: 14px; }
    .beta-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .beta-head h2 { font-size: 24px; letter-spacing: -.035em; }
    .beta-tag { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--pine); border: 1.5px dashed var(--moss); border-radius: 999px; padding: 3px 10px; }
    .beta-intro { color: var(--muted); font-size: 15px; max-width: 70ch; }
    .beta .games { padding-bottom: 0; }
    .game-card.link { text-decoration: none; color: inherit; }
    .back-main { font-size: 14px; font-weight: 700; padding-bottom: 22px; }
    .why { border-top: 1px solid var(--line); padding-block: 22px 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; color: var(--muted); font-size: 14px; }
    .why h3 { color: var(--ink); font-size: 15px; margin-bottom: 4px; }
    footer { border-top: 1px solid var(--line); padding-block: 18px 34px; color: var(--muted); font-size: 13px; }
    footer details { margin-top: 8px; }
    footer summary { cursor: pointer; font-weight: 650; }
    footer ul { padding-left: 18px; }

    /* Buttons */
    .btn { border: 1px solid transparent; min-height: 50px; padding: 11px 20px; border-radius: 11px; font-weight: 750; background: var(--pine); color: #fff; font-size: 16px; }
    .btn:hover { background: #34492f; }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .btn.ghost:hover { background: #e7e9dc; }
    .btn.big { min-height: 64px; font-size: 20px; flex: 1; }

    /* Tutorial */
    .tutorial { padding-block: clamp(22px, 5vw, 52px); display: grid; grid-template-columns: 1.1fr 1fr; gap: clamp(20px, 5vw, 56px); align-items: center; }
    .tutorial h1 { font-size: clamp(34px, 5.5vw, 62px); letter-spacing: -.06em; line-height: 1; }
    .steps { list-style: none; padding: 0; margin: 20px 0 24px; display: grid; gap: 14px; }
    .steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; font-size: 16px; }
    .steps b.n { width: 34px; height: 34px; border-radius: 50%; background: var(--pine); color: #fff; display: grid; place-items: center; font-size: 15px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .demo { border-radius: 16px; overflow: hidden; position: relative; background: var(--night); }
    .demo-caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px; background: linear-gradient(transparent, rgba(10, 14, 9, .85)); color: #fff; font-weight: 700; font-size: 15px; }

    /* Play */
    .play { padding-block: 14px 24px; display: grid; gap: 12px; }
    .hud { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
    .hud .round { font-weight: 750; }
    .hud .score { font-weight: 800; font-size: 20px; letter-spacing: -.03em; }
    .hud .quit { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 6px; text-decoration: underline; }
    .timer { height: 6px; border-radius: 6px; background: #d9decf; overflow: hidden; }
    .timer span { display: block; height: 100%; width: 100%; background: var(--moss); transform-origin: left; }
    .prompt { text-align: center; font-weight: 700; color: var(--muted); min-height: 1.5em; }
    .board { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
    .frame { position: relative; aspect-ratio: 3 / 2; width: min(100%, calc((100svh - 230px) * 1.5)); margin-inline: auto; border-radius: 12px; overflow: hidden; background: var(--night); touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: crosshair; }
    .frame img, .frame canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; -webkit-user-drag: none; }
    .frame img.mirror { transform: scaleX(-1); }
    .frame .veil { position: absolute; inset: 0; display: grid; place-items: center; background: var(--night); color: #f1f4e6; font-size: clamp(22px, 4vw, 38px); font-weight: 800; letter-spacing: -.03em; text-align: center; padding: 16px; }
    .ring { position: absolute; border: 3px solid var(--hit); border-radius: 50% / 40%; box-shadow: 0 0 0 4px rgba(255, 255, 255, .55), 0 0 22px rgba(47, 158, 68, .8); animation: pop .35s ease-out; pointer-events: none; }
    .ring.reveal { border-color: #ffd43b; box-shadow: 0 0 0 4px rgba(0, 0, 0, .35), 0 0 24px rgba(255, 212, 59, .9); }
    .mark { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; animation: fade .8s ease-out forwards; }
    .mark::before, .mark::after { content: ""; position: absolute; left: 13px; top: 2px; width: 4px; height: 26px; border-radius: 2px; background: var(--miss); box-shadow: 0 0 0 2px rgba(255, 255, 255, .7); }
    .mark::before { transform: rotate(45deg); } .mark::after { transform: rotate(-45deg); }
    .float { position: absolute; transform: translate(-50%, -100%); font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, .7); animation: rise .9s ease-out forwards; pointer-events: none; }
    .shake { animation: shake .3s; }
    @keyframes pop { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fade { 0% { opacity: 1; transform: scale(.6); } 30% { transform: scale(1); } 100% { opacity: 0; } }
    @keyframes rise { from { opacity: 1; } to { opacity: 0; margin-top: -34px; } }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .answers { display: flex; gap: 12px; width: min(100%, 560px); margin-inline: auto; }
    .answers .btn.no { background: #e1e6d6; color: var(--ink); border-color: #bfc8b4; }
    .feedback { text-align: center; font-weight: 800; font-size: 18px; min-height: 1.6em; }
    .feedback.ok { color: var(--hit); } .feedback.ko { color: var(--miss); }

    /* Results */
    .results { padding-block: clamp(24px, 6vw, 60px); max-width: 720px; margin-inline: auto; display: grid; gap: 18px; }
    .results .rank { font-size: clamp(40px, 8vw, 76px); font-weight: 850; letter-spacing: -.065em; line-height: .95; }
    .results .points { font-size: 20px; font-weight: 750; color: var(--moss); }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
    .stat b { display: block; font-size: 26px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 13px; color: var(--muted); }
    .insight { background: var(--pine); color: #eef3e2; border-radius: 16px; padding: 18px 20px; display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; }
    .insight img { width: 120px; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
    .insight h3 { font-size: 19px; color: #fff; margin-bottom: 4px; }
    .insight p { font-size: 15px; }
    .thanks { color: var(--muted); font-size: 15px; }
    .loading { padding: 80px 0; text-align: center; color: var(--muted); font-weight: 650; }

    @media (max-width: 860px) {
      .games { grid-template-columns: 1fr; }
      .game-card { flex-direction: row; }
      .game-art { aspect-ratio: auto; width: 38%; min-height: 150px; flex: none; }
      .tutorial { grid-template-columns: 1fr; }
      .tutorial .demo { order: -1; }
      .why { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .game-card { flex-direction: column; }
      .game-art { width: 100%; min-height: 0; aspect-ratio: 16 / 8; }
      .stats { grid-template-columns: 1fr 1fr 1fr; }
      .stat b { font-size: 21px; }
      .insight { grid-template-columns: 76px 1fr; }
      .insight img { width: 76px; }
      .btn.big { min-height: 72px; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <button class="brand" id="home-link" type="button"><i aria-hidden="true"></i>TerrainWeave</button>
      <div class="lang" role="group" aria-label="Lingua / Language">
        <button type="button" data-lang="it" aria-pressed="true">IT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main>
    <p class="loading" id="loading" data-t="loading"></p>

    <section id="home" hidden>
      <div class="wrap hero">
        <span class="eyebrow" data-t="eyebrow"></span>
        <h1 data-t="heroTitle"></h1>
        <p data-t="heroText"></p>
        <div class="actions"><button class="btn big quick" id="quick" type="button" data-t="quick"></button></div>
        <div class="chips"><span class="chip" data-t="chip1"></span><span class="chip" data-t="chip2"></span><span class="chip" data-t="chip3"></span></div>
      </div>
      <div class="wrap games" id="games"></div>
      <div class="wrap beta" id="beta" hidden>
        <div class="beta-head"><h2 data-t="betaTitle"></h2><span class="beta-tag" data-t="betaTag"></span></div>
        <p class="beta-intro" data-t="betaIntro"></p>
        <div class="games" id="beta-games"></div>
      </div>
      <p class="wrap back-main" id="back-main" hidden><a href="../" data-t="backMain"></a></p>
      <div class="wrap why">
        <div><h3 data-t="why1t"></h3><p data-t="why1"></p></div>
        <div><h3 data-t="why2t"></h3><p data-t="why2"></p></div>
        <div><h3 data-t="why3t"></h3><p data-t="why3"></p></div>
      </div>
    </section>

    <section id="tutorial" hidden>
      <div class="wrap tutorial">
        <div>
          <span class="eyebrow" id="tut-eyebrow"></span>
          <h1 id="tut-title" tabindex="-1"></h1>
          <ol class="steps" id="tut-steps"></ol>
          <div class="actions">
            <button class="btn" id="tut-go" type="button"></button>
            <button class="btn ghost" id="tut-back" type="button" data-t="back"></button>
          </div>
        </div>
        <div class="demo" id="tut-demo"></div>
      </div>
    </section>

    <section id="play" hidden>
      <div class="wrap play">
        <div class="hud">
          <span class="round" id="hud-round"></span>
          <span class="score" id="hud-score"></span>
          <button class="quit" id="quit" type="button" data-t="quit"></button>
        </div>
        <div class="timer"><span id="timer"></span></div>
        <p class="prompt" id="prompt" aria-live="polite"></p>
        <div class="board" id="board"></div>
        <div class="answers" id="answers" hidden>
          <button class="btn big" id="yes" type="button"></button>
          <button class="btn big no" id="no" type="button"></button>
        </div>
        <p class="feedback" id="feedback" aria-live="polite"></p>
      </div>
    </section>

    <section id="results" hidden>
      <div class="wrap results">
        <span class="eyebrow" id="res-game"></span>
        <h1 class="rank" id="res-rank" tabindex="-1"></h1>
        <p class="points" id="res-points"></p>
        <div class="stats" id="res-stats"></div>
        <div class="insight" id="res-insight"></div>
        <p class="thanks" data-t="thanks"></p>
        <div class="actions">
          <button class="btn" id="res-share" type="button" data-t="share"></button>
          <button class="btn ghost" id="res-again" type="button" data-t="again"></button>
          <button class="btn ghost" id="res-other" type="button" data-t="other"></button>
        </div>
        <p class="thanks" id="share-note" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p data-t="privacy"></p>
      <details><summary data-t="howTitle"></summary><p data-t="how"></p></details>
      <details><summary data-t="creditsTitle"></summary><ul id="credits"></ul></details>
    </div>
  </footer>

  <script src="config.js"></script>
  <script>
  'use strict';
  const CONFIG = window.TW_CONFIG || {};
  const ROUND_MS = 15000;
  const SQUAD_MS = 25000;
  // Players found 250 ms too short to see anything; rows store the real exposure_ms.
  const FLASH_MS = 500;
  const MASK_MS = 300;
  // A non-launch study (the beta page) compares universal with reference patterns in Squad only.
  const STUDY = CONFIG.study || 'launch';
  const BETA = STUDY !== 'launch';
  const GAMES = BETA ? { squad: { rounds: 6, badge: 'β' } } : {
    squad: { rounds: 6, badge: 'A' },
    find: { rounds: 10, badge: 'B' },
    flash: { rounds: 12, badge: 'C' },
  };

  const TEXT = {
    it: {
      loading: 'Carico i paesaggi…',
      eyebrow: 'Un esperimento di mimetismo · 1 minuto a partita',
      heroTitle: 'Riesci a trovare l’omino mimetizzato?',
      heroText: 'Abbiamo generato dei mimetismi analizzando foto di boschi, deserti, montagne e città. Ora serve il tuo occhio: ogni partita ci dice quali funzionano davvero e quali no.',
      chip1: '3 mini giochi', chip2: 'Paesaggi reali da tutto il mondo', chip3: 'Anonimo, senza registrazione',
      why1t: 'Perché giocare?', why1: 'Gli algoritmi misurano colori e contrasti, ma solo l’occhio umano dice se un mimetismo inganna davvero.',
      why2t: 'Cosa confrontiamo', why2: 'Lo stesso paesaggio con mimetismi diversi, generati da TerrainWeave o di riferimento, sempre nello stesso punto: cambia solo il mimetismo.',
      quick: 'Gioca subito →',
      why3t: 'Cosa succede ai dati', why3: 'Tempi e tocchi anonimi alimentano il prossimo ciclo di ottimizzazione. Più partite, mimetismi migliori.',
      games: {
        find: { name: 'Caccia', hook: 'Quanto ci metti a trovarlo?', text: '10 paesaggi, un omino nascosto in ognuno. Toccalo appena lo vedi: più sei veloce, più punti fai.' },
        flash: { name: 'Lampo', hook: 'Hai solo mezzo secondo', text: 'L’immagine appare per un istante. C’era qualcuno o no? Attento: a volte il paesaggio è vuoto.' },
        squad: { name: 'Pattuglia', hook: '{n} omini, una sola foto', text: 'Nella stessa foto si nascondono {n} omini, ognuno con un mimetismo diverso. Trovali tutti prima che scada il tempo!' },
      },
      minute: '~1 min', play: 'Gioca', best: (n) => `Record: ${n}`,
      tutorial: 'Come si gioca',
      steps: {
        find: ['Appare un paesaggio con un omino mimetizzato, come quello evidenziato nell\u2019immagine.', 'Toccalo o cliccaci sopra il prima possibile. I tocchi sbagliati costano punti.', 'Hai 15 secondi: se non lo trovi, ti mostriamo dov’era.'],
        flash: ['Tieni lo sguardo al centro: l’immagine appare per mezzo secondo.', 'Rispondi: c’era un omino? Sì o No. Puoi usare anche i tasti S e N.', 'In circa metà delle immagini non c’è nessuno: non tirare a indovinare!'],
        squad: ['In ogni foto si nascondono {n} omini, ognuno vestito con un mimetismo diverso.', 'Toccali tutti, uno alla volta: l’ordine in cui li trovi ci dice quale mimetismo si nota di più.', 'Hai 25 secondi per foto. I tocchi a vuoto costano punti, trovarli tutti vale un bonus.'],
      },
      demoCaption: 'Eccolo! Questo è l’omino da cercare.',
      go: 'Ho capito, giochiamo!', back: 'Indietro', quit: 'Esci',
      round: (i, n) => `Round ${i}/${n}`, points: (n) => `${n} pt`,
      ready: ['3', '2', '1'],
      promptFind: 'Tocca l’omino!',
      promptFlash: 'Guarda il centro…', askFlash: 'C’era un omino?',
      promptSquad: (found, total) => `Trovati ${found} di ${total}: continua!`, allFound: 'Tutti trovati! +100 bonus', squadTimeout: (n) => `Tempo scaduto: ne mancavano ${n}.`,
      insightSquad: (r, n) => `In media è stato trovato per ${r}° su ${n} (${n + 1} = mai trovato).`,
      yes: 'Sì (S)', no: 'No (N)',
      found: (s) => `Trovato in ${s} s!`, timeout: 'Tempo scaduto: eccolo qui.', miss: 'Mancato!',
      right: 'Giusto!', wrong: 'Sbagliato!', wasThere: 'C’era: guarda dov’era.', wasEmpty: 'Non c’era nessuno.',
      ranks: ['Recluta', 'Esploratore', 'Ranger', 'Occhio di falco'],
      statFound: 'trovati', statTime: 'tempo medio', statMiss: 'tocchi a vuoto', statCorrect: 'risposte giuste', statFa: 'falsi allarmi', statHits: 'omini visti',
      insightTitle: (v) => `Il mimetismo che ti ha ingannato di più: ${v}`,
      insightFind: (s, env) => `In media ci hai messo ${s} s a trovarlo (${env}).`,
      insightFlash: (p) => `Te lo sei perso nel ${p}% delle apparizioni.`,
      insightNone: 'Nessun mimetismo ti ha messo in difficoltà. Prova un altro gioco!',
      thanks: 'Grazie! Ogni partita viene salvata in forma anonima e ci aiuta a migliorare i mimetismi.',

  // ---------- scene frames ----------

  function pickScenes(count) {

      bar.style.transform = `scaleX(${left})`;
      bar.style.background = left < 0.25 ? 'var(--miss)' : 'var(--moss)';
      if (left > 0) current.raf = requestAnimationFrame(tick);
      else onEnd();
    };
    current.raf = requestAnimationFrame(tick);
  }
  function nextRound() {
    clearTimers();
    current.index++;
    if (current.index >= current.rounds.length) return finish();
    hud();
    $('feedback').textContent = '';
    $('feedback').className = 'feedback';
    const round = current.rounds[current.index];
    if (current.game === 'flash') return flashRound(round);
    if (current.game === 'squad') return squadRound(round);
    searchRound(round);
  }

  function searchRound(round) {
    const board = $('board');
    board.innerHTML = '';
    board.className = 'board';
    const frames = [makeFrame(round.scene, round.variant, false)];
    frames.forEach((f) => board.append(f.el));
    $('prompt').textContent = t().promptFind;
    let misses = 0, done = false, shownAt = 0;
    const end = (frame, tap) => {
      if (done) return;
      done = true;
      cancelAnimationFrame(current.raf);
      const latency = Math.round(performance.now() - shownAt);
      const found = Boolean(frame);
      frames.forEach((f) => ring(f, round.scene.box, found && f === frame, true));
      const gained = found ? Math.max(20, 100 + Math.round(200 * (1 - latency / ROUND_MS)) - 20 * misses) : 0;
      current.score += gained;
      hud();
      if (found) floatText(frame, tap.px, tap.py, `+${gained}`);
      $('feedback').className = 'feedback ' + (found ? 'ok' : 'ko');
      $('feedback').textContent = found ? t().found((latency / 1000).toFixed(1)) : t().timeout;
      const entry = {
        round: current.index, scene_id: round.scene.id, environment: round.scene.environment,
        variant: round.variant, outcome: found ? 'found' : 'timeout',
        chosen: found ? frame.variant : null, latency_ms: found ? latency : ROUND_MS, misses,
        tap_x: tap ? Math.round(tap.x * 1000) / 1000 : null, tap_y: tap ? Math.round(tap.y * 1000) / 1000 : null,
        image_w: Math.round(frames[0].el.getBoundingClientRect().width),
      };
      current.log.push({ ...entry, gained });
      record(entry);
      later(nextRound, found ? 1100 : 1900);
    };
    frames.forEach((frame) => {
      frame.el.addEventListener('pointerdown', (event) => {
        if (done || !shownAt) return;
        event.preventDefault();
        const tap = tapPosition(frame, event);
        if (isHit(round.scene.box, tap.x, tap.y)) { buzz(25); return end(frame, tap); }
        buzz(70);
        misses++;
        const mark = document.createElement('div');
        mark.className = 'mark';
        Object.assign(mark.style, { left: `${tap.px * 100}%`, top: `${tap.py * 100}%` });
        frame.el.append(mark);
        later(() => mark.remove(), 800);
        frame.el.classList.remove('shake'); void frame.el.offsetWidth; frame.el.classList.add('shake');
        $('feedback').className = 'feedback ko';
        $('feedback').textContent = t().miss;
      });
    });
    Promise.all(frames.map((f) => f.img.decode().catch(() => {}))).then(() => {
      if (done) return;
      shownAt = performance.now();
      runTimer(ROUND_MS, () => end(null, null));
    });
  }

  function squadRound(round) {
    const board = $('board');
    board.className = 'board';
    board.innerHTML = '';
    const frame = makeFrame(round.scene, round.variant, false);
    board.append(frame.el);
    const total = round.targets.length;
    const found = new Set();
    let misses = 0, done = false, shownAt = 0, roundScore = 0;
    $('prompt').textContent = t().promptSquad(0, total);
    const base = {
      round: current.index, scene_id: round.scene.id, environment: round.scene.environment, layout: round.layout,
    };
    const finishRound = () => {
      if (done) return;
      done = true;
      cancelAnimationFrame(current.raf);
      const missing = round.targets.map((target, i) => [target, i]).filter(([, i]) => !found.has(i));
      for (const [target, i] of missing) {
        ring(frame, target.box, false, true);
        const entry = { ...base, target: i, variant: target.variant, outcome: 'timeout', latency_ms: SQUAD_MS, misses: 0, found_order: null, image_w: Math.round(frame.el.getBoundingClientRect().width) };
        current.log.push(entry);
        record(entry);
      }
      if (!missing.length) { current.score += 100; roundScore += 100; }
      hud();
      $('feedback').className = 'feedback ' + (missing.length ? 'ko' : 'ok');
      $('feedback').textContent = missing.length ? t().squadTimeout(missing.length) : t().allFound;
      later(nextRound, missing.length ? 2200 : 1300);
    };
    frame.el.addEventListener('pointerdown', (event) => {
      if (done || !shownAt) return;
      event.preventDefault();
      const tap = tapPosition(frame, event);
      const index = round.targets.findIndex((target) => isHit(target.box, tap.x, tap.y));
      if (index >= 0 && found.has(index)) return; // already found: not a miss
      if (index >= 0) {
        found.add(index);
        const latency = Math.round(performance.now() - shownAt);
        const gained = Math.max(10, 50 + Math.round(100 * (1 - latency / SQUAD_MS)) - 15 * misses);
        current.score += gained; roundScore += gained;
        hud();
        const target = round.targets[index];
        ring(frame, target.box, true, true);
        buzz(25);
        floatText(frame, tap.px, tap.py, `#${found.size} +${gained}`);
        const entry = {
          ...base, target: index, variant: target.variant, outcome: 'found', latency_ms: latency, misses,
          found_order: found.size, tap_x: Math.round(tap.x * 1000) / 1000, tap_y: Math.round(tap.y * 1000) / 1000,
          image_w: Math.round(frame.el.getBoundingClientRect().width),
        };
        current.log.push(entry);
        record(entry);
        misses = 0;
        $('feedback').className = 'feedback ok';
        $('feedback').textContent = '';
        $('prompt').textContent = t().promptSquad(found.size, total);
        if (found.size === total) finishRound();
        return;
      }
      misses++;
      const mark = document.createElement('div');
      mark.className = 'mark';
      Object.assign(mark.style, { left: `${tap.px * 100}%`, top: `${tap.py * 100}%` });
      frame.el.append(mark);
      later(() => mark.remove(), 800);
      frame.el.classList.remove('shake'); void frame.el.offsetWidth; frame.el.classList.add('shake');
      $('feedback').className = 'feedback ko';
      $('feedback').textContent = t().miss;
    });
    frame.img.decode().catch(() => {}).then(() => {
      if (done) return;
      shownAt = performance.now();
      runTimer(SQUAD_MS, finishRound);
    });
  }

  function noiseMask(canvas) {
    const ctx = canvas.getContext('2d');
    canvas.width = 96; canvas.height = 64;
    const colors = ['#2f3a26', '#5b6b3c', '#8b8a5c', '#3d4a35', '#a69a70', '#1f2a1c', '#6f7d55', '#c2b48a'];
    for (let y = 0; y < 64; y += 4) for (let x = 0; x < 96; x += 4) {
      ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
      ctx.fillRect(x, y, 4, 4);
    }
  }
  function flashRound(round) {
    const board = $('board');
    board.className = 'board';
    board.innerHTML = '';
    const frame = makeFrame(round.scene, round.present ? round.variant : 'absent', false);
    frame.el.style.cursor = 'default';
    frame.img.style.visibility = 'hidden';
    const fixation = document.createElement('div');
    fixation.className = 'veil';
    fixation.textContent = '+';
    const mask = document.createElement('canvas');
    mask.hidden = true;
    frame.el.append(fixation, mask);
    board.append(frame.el);
    $('answers').hidden = true;
    $('prompt').textContent = t().promptFlash;
    $('timer').style.transform = 'scaleX(1)';
    let exposure = 0, answeredAt = 0, done = false;
    frame.img.decode().catch(() => {}).then(() => later(() => {
      fixation.hidden = true;
      frame.img.style.visibility = 'visible';
      // Measure the real on-screen time: frames, not timers, decide visibility.
      requestAnimationFrame((first) => {
        const step = (now) => {
          if (now - first + 8 < FLASH_MS) return (current.raf = requestAnimationFrame(step));
          frame.img.style.visibility = 'hidden';
          noiseMask(mask);
          mask.hidden = false;
          exposure = Math.round(now - first);
          later(() => {
            mask.hidden = true;
            fixation.textContent = '?';
            fixation.hidden = false;
            $('prompt').textContent = t().askFlash;
            $('answers').hidden = false;
            answeredAt = performance.now();
          }, MASK_MS);
        };
        current.raf = requestAnimationFrame(step);
      });
    }, 500 + Math.random() * 500));
    current.answer = (value) => {
      if (done || !answeredAt) return;
      done = true;
      current.answer = null;
      const latency = Math.round(performance.now() - answeredAt);
      const correct = (value === 'yes') === round.present;
      const gained = correct ? 100 : 0;
      current.score += gained;
      hud();
      $('answers').hidden = true;
      fixation.hidden = true;
      frame.img.style.visibility = 'visible';
      if (round.present) ring(frame, round.scene.box, correct, true);
      $('feedback').className = 'feedback ' + (correct ? 'ok' : 'ko');
      $('feedback').textContent = `${correct ? t().right : t().wrong} ${round.present ? t().wasThere : t().wasEmpty}`;
      const entry = {
        round: current.index, scene_id: round.scene.id, environment: round.scene.environment,
        variant: round.present ? round.variant : null, outcome: 'answered', latency_ms: latency,
        exposure_ms: exposure, figure_present: round.present, answer: value, correct,
        image_w: Math.round(frame.el.getBoundingClientRect().width),
      };
      current.log.push({ ...entry, gained });
      record(entry);
      later(nextRound, 1300);
    };
  }
  $('yes').onclick = () => current && current.answer && current.answer('yes');
  $('no').onclick = () => current && current.answer && current.answer('no');
  addEventListener('keydown', (event) => {
    if (!current || !current.answer || event.repeat) return;
    const key = event.key.toLowerCase();
    if (key === 's' || key === 'y') current.answer('yes');
    if (key === 'n') current.answer('no');
  });

  // ---------- results ----------
  function finish() {
    clearTimers();
    const { game, log, score } = current;
    const max = game === 'squad' ? current.rounds.length * (150 * squadSize() + 100) : log.length * (game === 'flash' ? 100 : 300);
    const ratio = max ? score / max : 0;
    const rank = t().ranks[ratio < 0.35 ? 0 : ratio < 0.6 ? 1 : ratio < 0.8 ? 2 : 3];
    const best = store.get(key('tw-best'), {});
    best[game] = Math.max(best[game] || 0, score);
    store.set(key('tw-best'), best);
    current.rank = rank;
    $('res-game').textContent = gameCopy(game).name;
    $('res-rank').textContent = rank;
    $('res-points').textContent = t().points(score);
    const stat = (value, label) => `<div class="stat"><b>${value}</b><span>${label}</span></div>`;
    let insight = null;
    if (game === 'squad') {
      const found = log.filter((e) => e.outcome === 'found');
      const avg = found.length ? (found.reduce((s, e) => s + e.latency_ms, 0) / found.length / 1000).toFixed(1) : '–';
      $('res-stats').innerHTML = stat(`${found.length}/${log.length}`, t().statFound)
        + stat(`${avg} s`, t().statTime) + stat(log.reduce((s, e) => s + (e.misses || 0), 0), t().statMiss);
      // The hardest pattern is the one found last on average (missed counts as 5).
      const ranks = {};
      for (const e of log) {
        (ranks[e.variant] ||= { total: 0, n: 0, e });
        const missed = squadSize() + 1;
        ranks[e.variant].total += e.found_order || missed; ranks[e.variant].n++;
        if ((e.found_order || missed) >= (ranks[e.variant].e.found_order || missed)) ranks[e.variant].e = e;
      }
      const worst = Object.entries(ranks).sort((a, b) => b[1].total / b[1].n - a[1].total / a[1].n)[0];
      if (worst) insight = { variant: worst[0], scene: worst[1].e.scene_id, text: t().insightSquad((worst[1].total / worst[1].n).toFixed(1), squadSize()) };
    } else if (game === 'flash') {
      const present = log.filter((e) => e.figure_present);
      const absent = log.filter((e) => !e.figure_present);
      $('res-stats').innerHTML = stat(`${log.filter((e) => e.correct).length}/${log.length}`, t().statCorrect)
        + stat(`${present.filter((e) => e.answer === 'yes').length}/${present.length}`, t().statHits)
        + stat(`${absent.filter((e) => e.answer === 'yes').length}/${absent.length}`, t().statFa);
      const missed = {};
      for (const e of present) { (missed[e.variant] ||= { n: 0, miss: 0, e }); missed[e.variant].n++; missed[e.variant].miss += e.answer === 'no'; }
      const worst = Object.entries(missed).sort((a, b) => b[1].miss / b[1].n - a[1].miss / a[1].n)[0];
      if (worst && worst[1].miss) insight = { variant: worst[0], scene: worst[1].e.scene_id, text: t().insightFlash(Math.round(100 * worst[1].miss / worst[1].n)) };
    } else {
      const found = log.filter((e) => e.outcome === 'found');
      const avg = found.length ? (found.reduce((s, e) => s + e.latency_ms, 0) / found.length / 1000).toFixed(1) : '–';
      $('res-stats').innerHTML = stat(`${found.length}/${log.length}`, t().statFound)
        + stat(`${avg} s`, t().statTime) + stat(log.reduce((s, e) => s + e.misses, 0), t().statMiss);
      // The hardest pattern is the slowest one to find.
      const cost = {};
      for (const e of log) {
        const hidden = e.variant;
        (cost[hidden] ||= { total: 0, n: 0, e }); cost[hidden].total += e.latency_ms; cost[hidden].n++;
        if (e.latency_ms > cost[hidden].e.latency_ms) cost[hidden].e = e;
      }
      const worst = Object.entries(cost).sort((a, b) => b[1].total / b[1].n - a[1].total / a[1].n)[0];
      if (worst) insight = { variant: worst[0], scene: worst[1].e.scene_id, text: t().insightFind((worst[1].total / worst[1].n / 1000).toFixed(1), t().env[worst[1].e.environment] || worst[1].e.environment) };
    }
    if (insight) {
      $('res-insight').innerHTML = `<img alt="" src="scenes/${insight.scene}/${insight.variant}.jpg"><div><h3></h3><p></p></div>`;
      $('res-insight').querySelector('h3').textContent = t().insightTitle(t().variants[insight.variant] || insight.variant);
      $('res-insight').querySelector('p').textContent = insight.text;
    } else {
      $('res-insight').innerHTML = '<div><p></p></div>';
      $('res-insight').querySelector('p').textContent = t().insightNone;
    }
    $('share-note').textContent = '';
    show('results');
    $('res-rank').focus();
    flush();
  }
  async function share() {
    const url = location.href.split('#')[0];
    const text = t().shareText(current.rank, current.score, gameCopy(current.game).name);
    if (navigator.share) {
      try { await navigator.share({ title: 'TerrainWeave', text, url }); return; } catch { /* cancelled */ }
    }
    try { await navigator.clipboard.writeText(`${text} ${url}`); $('share-note').textContent = t().copied; } catch { /* clipboard blocked */ }
    window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`, '_blank', 'noopener');
  }

  // ---------- wiring ----------
  $('home-link').onclick = goHome;
  $('quick').onclick = () => playGame('squad');
  if (TEST) $('home-link').insertAdjacentHTML('beforeend', '<span class="test-badge">TEST</span>');
  $('quit').onclick = goHome;
  $('tut-back').onclick = goHome;
  $('res-again').onclick = () => openTutorialOrStart(current.game);
  $('res-other').onclick = goHome;
  $('res-share').onclick = share;
  function openTutorialOrStart(game) { startGame(game); }
  document.querySelectorAll('.lang button').forEach((button) => {
    button.onclick = () => { lang = button.dataset.lang; store.set('tw-lang', lang); translate(); };
  });

  translate();
  fetch('manifest.json', { cache: 'no-cache' })
    .then((r) => r.json())
    .then((data) => {
      manifest = data;
      translate();
      const game = location.hash.slice(1);
      if (GAMES[game]) openTutorial(game); else show('home');
      flush();
    })
    .catch(() => { $('loading').textContent = 'Errore nel caricamento / Loading error. Ricarica la pagina.'; });
  </script>
</body>
</html>
