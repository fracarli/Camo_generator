[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camo-pattern-lab"
version = "0.1.0"
description = "Explainable procedural camouflage pattern generation and evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
]

[project.optional-dependencies]
ml = [
  "torch",
  "torchvision",
  "transformers",
  "accelerate",
]

[tool.setuptools.packages.find]
where = ["src"]
